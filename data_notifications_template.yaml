AWSTemplateFormatVersion: '2010-09-09'
Description: >
  data-notifications

  Handles notifications for data pipeline.

Parameters:
  ApplicationEnvironment:
    Type: String
    Description: The environment in which the application should be deployed.
    AllowedValues:
      - dev
      - prod
  ApplicationName:
    Type: String
    Description: The name of the application to be deployed.
  TeamsUrl:
    Type: String
    Description: URL for a Teams channel webhook.
  Workload:
    Type: String
    Description: Name of workload for this stack.

Resources:
  HandleDataNotificationsRole:
    Type: AWS::IAM::Role
    Properties: 
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: !Sub 'Allows ${ApplicationName} lambda to be executed successfully.'
      Policies:
        - PolicyName: DataParameterStorePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'ssm:GetParametersByPath*'
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApplicationEnvironment}/${ApplicationName}*'
        - PolicyName: DataLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !GetAtt NotificationsLogGroup.Arn
  
  DataEventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: data-events
        Tags:
          - Key: Environment
            Value: !Ref ApplicationEnvironment
          - Key: Application
            Value: !Ref ApplicationName
          - Key: Workload
            Value: !Ref Workload
          - Key: WorkloadType
            Value: processing

  TeamsUrlParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: URL for Teams Channel webhook.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/TEAMS_URL
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref TeamsUrl

  HandleDataNotificationsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Sub 'rac-${ApplicationEnvironment}-lambda'
        S3Key: !Sub '${ApplicationName}.zip'
      FunctionName: !Ref ApplicationName
      Handler: handle_data_notifications.lambda_handler
      LoggingConfig:
        LogGroup: !Ref NotificationsLogGroup
      Role: !GetAtt HandleDataNotificationsRole.Arn
      Runtime: python3.11
      Timeout: 30
      Environment:
        Variables:
          ENV: !Ref ApplicationEnvironment
          APP_CONFIG_PATH: !Ref ApplicationName
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      Architectures:
        - x86_64

  NotificationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      LogGroupName: !Sub "/aws/lambda/${ApplicationName}"
      RetentionInDays: 90
  
  HandleDataNotificationsFunctionDataEventsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HandleDataNotificationsFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref DataEventsTopic
  
  HandleDataNotificationsFunctionDataEvents:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !GetAtt HandleDataNotificationsFunction.Arn
      Protocol: lambda
      TopicArn: !Ref DataEventsTopic

Outputs:
  HandleDataNotificationsFunction:
    Description: 'Handle Data Notifications Lambda Function ARN'
    Value: !GetAtt HandleDataNotificationsFunction.Arn
  DataEventsTopic:
    Description: 'Data Events SNS Topic ARN'
    Value: !Ref DataEventsTopic
    Export:
      Name:
        Data-SNSTopicArn