AWSTemplateFormatVersion: '2010-09-09'
Description: >
  data-notifications

  Handles notifications for events generated by data pipeline.

Parameters:
  ApplicationEnvironment:
    Type: String
    Description: The environment in which the application should be deployed.
    AllowedValues:
      - dev
      - prod
  ApplicationName:
    Type: String
    Description: The name of the application to be deployed.
  NotificationsQueueArn:
    Type: String
    Description: ARN for notifications SQS Queue
  SecurityGroup:
    Type: String
    Description: ARN for security group to which Lambda should be attached.
  Subnet:
    Type: String
    Description: ARN for subnet to which Lambda should be attached.
  TeamsUrl:
    Type: String
    Description: URL for Teams Channel to which messages will be posted.
  Workload:
    Type: String
    Description: Name of workload for this stack.

Resources:
  TeamsUrlParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: URL for a Teams channel.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/TEAMS_URL
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref TeamsUrl

  DataNotificationsRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: !Sub 'Allows ${ApplicationName} lambda to be executed successfully.'
      Policies:
        - PolicyName: DataNotificationsParameterStorePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'ssm:GetParametersByPath*'
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApplicationEnvironment}/${ApplicationName}*'
        - PolicyName: DataNotificationsLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !GetAtt NotificationsLogGroup.Arn
        - PolicyName: DataNotificationsSQSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sqs:ReceiveMessage'
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                Resource: !Ref NotificationsQueueArn
        - PolicyName: DataNotificationsVpcPolicy
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "ec2:CreateNetworkInterface"
                  - "ec2:DescribeNetworkInterfaces"
                  - "ec2:DescribeSubnets"
                  - "ec2:DeleteNetworkInterface"
                  - "ec2:AssignPrivateIpAddresses"
                  - "ec2:UnassignPrivateIpAddresses"
                Resource:
                  - "*"

  DataNotificationsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Sub 'rac-${ApplicationEnvironment}-lambda'
        S3Key: !Sub '${ApplicationName}.zip'
      Description: Sends error notifications to a Teams channel.
      FunctionName: !Ref ApplicationName
      Handler: handle_data_notifications.lambda_handler
      LoggingConfig:
        LogGroup: !Ref NotificationsLogGroup
      Role: !GetAtt DataNotificationsRole.Arn
      Runtime: python3.12
      Timeout: 30
      Environment:
        Variables:
          ENV: !Ref ApplicationEnvironment
          APP_CONFIG_PATH: !Ref ApplicationName
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      Architectures:
        - x86_64
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroup
        SubnetIds:
          - !Ref Subnet

  NotificationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      LogGroupName: !Sub "/rac/${ApplicationEnvironment}/data_pipeline/lambda/${ApplicationName}"
      RetentionInDays: 90

  DataNotificationsEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref NotificationsQueueArn
      FunctionName: !GetAtt DataNotificationsFunction.Arn

Outputs:
  DataNotificationsFunction:
    Description: 'Data Notifications Lambda Function ARN'
    Value: !GetAtt DataNotificationsFunction.Arn