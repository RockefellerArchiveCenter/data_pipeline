AWSTemplateFormatVersion: '2010-09-09'
Description: >
  data-index

  Indexes transformed records into Elasticsearch.

Parameters:
  ApplicationEnvironment:
    Type: String
    Description: The environment in which the application should be deployed.
    AllowedValues:
      - dev
      - prod
  ApplicationName:
    Type: String
    Description: The name of the application to be deployed.
  ElasticsearchHosts:
    Type: String
    Description: Comma-separated hostnames (including ports, if applicable) where Elasticsearch is available.
  ElasticsearchIndex:
    Type: String
    Description: Name of Elasticsearch index to target.
  ElasticsearchApiKey:
    Type: String
    Description: API key provided by Elasticsearch. Leave blank if not applicable.
  ElasticsearchTimeout:
    Type: Number
    Description: Elasticsearch connection timeout in seconds, defaults to 60 seconds in the code if not provided.
  SNSTopicArn:
    Type: String
    Description: ARN for event SNS Topic
  SQSQueueArn:
    Type: String
    Description: ARN for SQS Queue which triggers lambda
  SecurityGroup:
    Type: String
    Description: ARN for security group to which Lambda should be attached.
  Subnet:
    Type: String
    Description: ARN for subnet to which Lambda should be attached.
  Workload:
    Type: String
    Description: Name of workload for this stack.

Resources:
  ElasticsearchHostsParam:
    Type: AWS::SSM::Parameter
    Properties:
      Description: Comma-separated hostnames (including ports, if applicable) where Elasticsearch is available.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/ELASTICSEARCH_HOSTS
      Tags:
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String # this was a list of strings in scorpio, but I don't think that's a valid data type here. We may need to update the code to split this.
      Value: !Ref ElasticsearchHosts

  ElasticsearchIndexParam:
    Type: AWS::SSM::Parameter
    Properties:
      Description: Name of the Elasticsearch index.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/ELASTICSEARCH_INDEX
      Tags:
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref ElasticsearchIndex

  ElasticsearchApiKeyParam:
    Type: AWS::SSM::Parameter
    Properties:
      Description: API key provided by Elasticsearch. Leave blank if not applicable.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/ELASTICSEARCH_API_KEY
      Tags:
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref ElasticsearchApiKey

  SnsTopicParam:
    Type: AWS::SSM::Parameter
    Properties:
      Description: ARN for SNS topic to send messages to.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AWS_SNS_TOPIC
      Tags:
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref SNSTopicArn

  DataIndexRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: !Sub 'Allows ${ApplicationName} lambda to be executed successfully.'
      Policies:
        - PolicyName: DataIndexParameterStorePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:GetParametersByPath*'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApplicationEnvironment}/${ApplicationName}*'
        - PolicyName: DataIndexLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !GetAtt DataIndexLogGroup.Arn
        - PolicyName: DataIndexSQSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sqs:ReceiveMessage'
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                Resource: !Ref SQSQueueArn
        - PolicyName: DataIndexSNSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sns:Publish'
                Resource:
                  - !Ref SNSTopicArn

  DataIndexFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Sub 'rac-${ApplicationEnvironment}-lambda'
        S3Key: !Sub '${ApplicationName}.zip'
      FunctionName: !Ref ApplicationName
      Handler: data_index.lambda_handler
      LoggingConfig:
        LogGroup: !Ref DataIndexLogGroup
      Role: !GetAtt DataIndexRole.Arn
      Runtime: python3.12
      Timeout: 300 # this is 5 minutes. Not sure if we need to adjust this based on batch size.
      Environment:
        Variables:
          ENV: !Ref ApplicationEnvironment
          APP_CONFIG_PATH: !Ref ApplicationName
          ES_TIMEOUT: !Ref ElasticsearchTimeout
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      Architectures:
        - x86_64
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroup
        SubnetIds:
          - !Ref Subnet

  DataIndexLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      LogGroupName: !Sub "/aws/lambda/${ApplicationName}"
      RetentionInDays: 90

  DataIndexEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref SQSQueueArn
      FunctionName: !GetAtt DataIndexFunction.Arn

Outputs:
  DataIndexFunctionArn:
    Description: 'Data Index Lambda Function ARN'
    Value: !GetAtt DataIndexFunction.Arn