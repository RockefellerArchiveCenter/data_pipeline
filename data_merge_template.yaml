AWSTemplateFormatVersion: '2010-09-09'
Description: >
  data-merge

  Merges data from multiple sources.

Parameters:
  ApplicationEnvironment:
    Type: String
    Description: The environment in which the application should be deployed.
    AllowedValues:
      - dev
      - prod
  ApplicationName:
    Type: String
    Description: The name of the application to be deployed.
  ArchivesSpaceBaseurl:
    Type: String
    Description: Base URL for ArchivesSpace
  ArchivesSpaceUsername:
    Type: String
    Description: Username for ArchivesSpace
  ArchivesSpacePassword:
    Type: String
    Description: Password for ArchivesSpace
  CartographerBaseurl:
    Type: String
    Description: Base URL for Cartographer
  CartographerHealthCheckPath:
    Type: String
    Description: Health check path for Cartographer
  SNSTopicArn:
    Type: String
    Description: ARN for event SNS Topic
  SQSQueueArn:
    Type: String
    Description: ARN for SQS Queue which triggers lambda
  SecurityGroup:
    Type: String
    Description: ARN for security group to which Lambda should be attached.
  Subnet:
    Type: String
    Description: ARN for subnet to which Lambda should be attached.
  Workload:
    Type: String
    Description: Name of workload for this stack.

Resources:
  ArchivesSpaceBaseurlParam:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: Base URL for ArchivesSpace.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AS_BASEURL
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref ArchivesSpaceBaseurl
  ArchivesSpaceUsernameParam:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: Username for ArchivesSpace.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AS_USERNAME
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref ArchivesSpaceUsername
  ArchivesSpacePasswordParam:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: Password for ArchivesSpace.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AS_PASSWORD
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref ArchivesSpacePassword
  CartographerBaseurlParam:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: Base URL for Cartographer.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/CARTOGRAPHER_BASEURL
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref CartographerBaseurl
  CartographerHealthCheckPathParam:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: Health check path for Cartographer.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/CARTOGRAPHER_HEALTH_CHECK_PATH
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref CartographerHealthCheckPath
  SnsTopicParam:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: ARN for SNS topic to send messages to.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/SNS_TOPIC
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref SNSTopicArn

  DataMergeRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: !Sub 'Allows ${ApplicationName} lambda to be executed successfully.'
      Policies:
        - PolicyName: DataMergeParameterStorePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'ssm:GetParametersByPath'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApplicationEnvironment}/${ApplicationName}'
        - PolicyName: DataMergeSessionTokenParameterStorePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'ssm:GetParameter'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApplicationEnvironment}/data_fetch/*'
        - PolicyName: DataMergeLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !GetAtt DataMergeLogGroup.Arn
        - PolicyName: DataMergeSQSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sqs:ReceiveMessage'
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                Resource: !Ref SQSQueueArn
        - PolicyName: DataMergeSNSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sns:Publish'
                Resource:
                  - !Ref SNSTopicArn
        - PolicyName: DataMergeVpcPolicy
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "ec2:CreateNetworkInterface"
                  - "ec2:DescribeNetworkInterfaces"
                  - "ec2:DescribeSubnets"
                  - "ec2:DeleteNetworkInterface"
                  - "ec2:AssignPrivateIpAddresses"
                  - "ec2:UnassignPrivateIpAddresses"
                Resource:
                  - "*"

  DataMergeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Sub 'rac-${ApplicationEnvironment}-lambda'
        S3Key: !Sub '${ApplicationName}.zip'
      Description: Merges fetched data for discovery.
      FunctionName: !Ref ApplicationName
      Handler: src.merge_data.lambda_handler
      LoggingConfig:
        LogGroup: !Ref DataMergeLogGroup
      Role: !GetAtt DataMergeRole.Arn
      Runtime: python3.12
      Timeout: 30
      Environment:
        Variables:
          ENV: !Ref ApplicationEnvironment
          APP_CONFIG_PATH: !Ref ApplicationName
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      Architectures:
        - x86_64
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroup
        SubnetIds:
          - !Ref Subnet

  DataMergeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      LogGroupName: !Sub "/rac/${ApplicationEnvironment}/data_pipeline/lambda/${ApplicationName}"
      RetentionInDays: 90

  DataMergeEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref SQSQueueArn
      FunctionName: !GetAtt DataMergeFunction.Arn
      BatchSize: 5
      ScalingConfig:
        MaximumConcurrency: 30

Outputs:
  DataMergeFunctionArn:
    Description: 'Data Merge Lambda Function ARN'
    Value: !GetAtt DataMergeFunction.Arn